<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GT Web - Login</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14151c; color: #e8e8ee; font: 15px/1.4 system-ui, sans-serif; }
    main { width: min(420px, 92vw); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 14px; }
    .tabs button { background: #1f2130; border-color: #3a3d52; color: #aab; }
    .tabs button[aria-selected="true"] { background: #3b6df0; border-color: #3b6df0; color: #fff; }
    .hint { margin: 0; font-size: 12px; color: #8b8ea6; }
    [hidden] { display: none !important; }
    form { display: grid; gap: 10px; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3d52; background: #1f2130; color: inherit; }
    button { background: #3b6df0; border-color: #3b6df0; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 14px 0 6px; font-weight: 600; }
    #log { margin: 0; padding: 10px; min-height: 120px; max-height: 260px; overflow: auto; background: #0e0f15; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
    #game { width: min(1000px, 98vw); }
    #game canvas { width: 100%; background: #6fb7e8; border-radius: 8px; image-rendering: pixelated; display: block; }
    #bar { display: flex; gap: 8px; margin: 8px 0; }
    #bar input { flex: 1; min-width: 0; }
    #hotbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .slot { background: #1f2130; border-color: #3a3d52; padding: 6px 10px; font-size: 12px; }
    .slot.sel { background: #3b6df0; border-color: #3b6df0; }
    #stage { position: relative; overflow: hidden; border-radius: 8px; }
    #hud { position: absolute; inset: 0; pointer-events: none; font-family: system-ui, sans-serif; color: #fff; }
    #hud > * { pointer-events: auto; }
    .hud-top { position: absolute; top: 10px; left: 8px; width: 250px; height: 75px; display: flex; background: rgba(24,107,139,.67); border-radius: 6px; }
    .hud-avatar { width: 65px; height: 65px; margin: 5px; background: rgba(0,0,0,.25); border-radius: 4px; }
    .hud-topright { flex: 1; min-width: 0; padding: 5px 6px 0 0; }
    .hud-name { font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hud-gems { display: flex; align-items: center; gap: 6px; margin-top: 6px; background: rgba(0,0,0,.3); border-radius: 4px; padding: 2px 6px; }
    .hud-gem-icon { width: 24px; height: 24px; background-size: contain; background-repeat: no-repeat; }
    .hud-gem-text { font-weight: 700; }
    .hud-menu { position: absolute; top: 10px; right: 8px; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
    .hud-btn { position: relative; width: 76px; height: 76px; padding: 0; border: 0; background: transparent center/contain no-repeat; }
    .hud-badge { position: absolute; top: 0; right: 0; min-width: 20px; border-radius: 10px; background: #e33; font-size: 12px; text-align: center; }
    .hud-pop { background: rgba(24,107,139,.9); border-radius: 6px; padding: 6px; }
    .hud-popbtn { width: 100%; }
    .hud-console { position: absolute; right: 110px; top: 80px; min-width: 350px; width: 350px; display: flex; flex-direction: column; background: rgba(0,0,0,.45); border-radius: 6px; max-width: calc(100% - 130px); }
    .hud-tabs { display: flex; gap: 2px; }
    .hud-tab { flex: 1; padding: 4px; border: 0; border-radius: 4px 4px 0 0; font-size: 12px; color: #fff; opacity: .6; }
    .hud-tab.on { opacity: 1; }
    .hud-input { display: flex; align-items: center; margin: 0; gap: 4px; padding: 2px; }
    .hud-input input { flex: 1; min-width: 0; padding: 4px 6px; font-size: 13px; }
    .hud-count { font-size: 11px; opacity: .7; }
    .hud-log { height: 180px; overflow-y: auto; padding: 4px 6px; font-size: 13px; line-height: 1.35; word-break: break-word; }
    .err { color: #ff7b7b; } .ok { color: #7bdc9a; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Masuk ke server</h1>
    <div class="tabs" role="tablist">
      <button type="button" id="tab-login" role="tab" aria-selected="true">Masuk</button>
      <button type="button" id="tab-register" role="tab" aria-selected="false">Buat akun</button>
    </div>
    <form id="form">
      <input id="growid" name="growid" placeholder="GrowID" autocomplete="username" maxlength="18" required>
      <input id="password" name="password" type="password" placeholder="Kata sandi" autocomplete="current-password" maxlength="128" required>
      <input id="confirm" name="confirm" type="password" placeholder="Ulangi kata sandi" autocomplete="new-password" maxlength="128" hidden>
      <p class="hint" id="hint" hidden>GrowID 3-18 karakter (huruf, angka, atau _). Kata sandi minimal 6 karakter.</p>
      <button id="go" type="submit">Masuk</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <pre id="log"></pre>
  </main>
  <section id="game" hidden>
    <div id="bar">
      <input id="world" placeholder="Nama dunia (mis. START)" maxlength="24" autocomplete="off">
      <button id="join" type="button">Masuk dunia</button>
      <button id="leave" type="button">Keluar</button>
    </div>
    <div id="stage"><canvas id="screen" width="960" height="540"></canvas><div id="hud"></div></div>
    <div id="hotbar"></div>
    <p class="hint">A/D atau panah = jalan, W/Spasi = lompat, klik kiri = pukul, klik kanan = pasang, 1-9 = pilih item, roda mouse atau +/- = zoom, 0 = zoom normal.</p>
  </section>
  <script type="module" src="src/login-page.js"></script>
</body>
</html>
