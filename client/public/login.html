<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GT Web - Login</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14151c; color: #e8e8ee; font: 15px/1.4 system-ui, sans-serif; }
    main { width: min(420px, 92vw); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    form { display: grid; gap: 10px; }
    input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3d52; background: #1f2130; color: inherit; }
    button { background: #3b6df0; border-color: #3b6df0; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    #status { margin: 14px 0 6px; font-weight: 600; }
    #log { margin: 0; padding: 10px; min-height: 120px; max-height: 260px; overflow: auto; background: #0e0f15; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; }
    .err { color: #ff7b7b; } .ok { color: #7bdc9a; }
  </style>
</head>
<body>
  <main>
    <h1>Masuk ke server</h1>
    <form id="form">
      <input id="growid" name="growid" placeholder="GrowID" autocomplete="username" maxlength="18" required>
      <input id="password" name="password" type="password" placeholder="Kata sandi" autocomplete="current-password" maxlength="128" required>
      <button id="go" type="submit">Masuk</button>
    </form>
    <div id="status" aria-live="polite"></div>
    <pre id="log"></pre>
  </main>
  <script type="module" src="src/login-page.js"></script>
</body>
</html>
